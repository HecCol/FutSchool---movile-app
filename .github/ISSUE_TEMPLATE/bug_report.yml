name: Reportar un error
description: Documentar un fallo reproducible de la aplicación.
title: "fix: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema y comportamiento esperado
      description: Explica qué ocurrió y qué debería haber ocurrido.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: "1. Abrir la aplicación…"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Dispositivo, sistema y versión de FutSchool
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencias
      description: Agrega capturas o registros sin contraseñas ni datos privados.
